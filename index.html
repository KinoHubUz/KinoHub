<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KinoHub 🎬</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
html{scroll-behavior:smooth}
body{background:#07080c;color:white}
header{position:sticky;top:0;z-index:100;background:rgba(7,8,12,.94);border-bottom:1px solid #252731;padding:13px 15px;backdrop-filter:blur(18px)}
.nav{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px}
.logo{display:flex;align-items:center;gap:9px;font-size:24px;font-weight:900;letter-spacing:-1px;white-space:nowrap}
.logo-icon{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#ffdf38,#ff9d00);display:flex;align-items:center;justify-content:center;color:#111;font-size:21px;box-shadow:0 5px 20px rgba(255,190,0,.25)}
.logo-text{color:white}
.logo-text span{color:#ffcc00}
.search{width:100%;max-width:430px}
.search input{width:100%;padding:13px 18px;border-radius:30px;border:1px solid #333640;background:#14161d;color:white;outline:none;font-size:15px;transition:.25s}
.search input:focus{border-color:#ffcc00;box-shadow:0 0 0 3px rgba(255,204,0,.08)}
.hero{max-width:1200px;min-height:360px;margin:25px auto;padding:45px;border-radius:25px;display:flex;align-items:center;background:linear-gradient(90deg,#07080c 4%,rgba(7,8,12,.82),rgba(7,8,12,.18)),url("https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=1400&q=80") center/cover}
.hero-content{max-width:580px}
.hero small{color:#ffcc00;font-weight:bold;letter-spacing:3px}
.hero h1{font-size:45px;margin:12px 0;line-height:1.08}
.hero p{color:#ccc;line-height:1.6;margin-bottom:22px}
.hero-btn{display:inline-block;background:#ffcc00;color:#111;padding:13px 22px;border-radius:10px;text-decoration:none;font-weight:bold;transition:.25s}
.hero-btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(255,204,0,.2)}
.container{max-width:1200px;margin:auto;padding:10px 20px 50px}
.main-tabs{display:flex;gap:12px;margin:25px 0}
.main-tab{padding:12px 25px;border-radius:30px;border:1px solid #333640;background:#15171e;color:#ddd;cursor:pointer;font-size:15px;font-weight:bold;transition:.3s}
.main-tab:hover,.main-tab.active{background:#ffcc00;color:#111;border-color:#ffcc00}
.content-section{display:none}
.content-section.active{display:block}
.title{margin:25px 0 18px}
.title h2{font-size:26px}
.categories{display:flex;gap:10px;overflow-x:auto;padding-bottom:15px}
.categories button{white-space:nowrap;padding:10px 17px;border-radius:25px;border:1px solid #333640;background:#15171e;color:#ddd;cursor:pointer;transition:.25s}
.categories button.active,.categories button:hover{background:#ffcc00;color:#111}
.movies{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.movie{background:#12141a;border:1px solid #252731;border-radius:15px;overflow:hidden;transition:.3s;cursor:pointer}
.movie:hover{transform:translateY(-5px);border-color:#ffcc00;box-shadow:0 12px 35px rgba(255,204,0,.12)}
.movie.selected{outline:2px solid #ffcc00}
.poster{height:270px;position:relative;overflow:hidden;background:#191b22}
