<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KinoHub 🎬</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#08090d;
  color:white;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(8,9,13,.97);
  border-bottom:1px solid #252731;
  padding:15px;
  backdrop-filter:blur(15px);
}

.nav{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:25px;
  font-weight:bold;
  color:#ffcc00;
}

.logo span{
  color:white;
}

.search{
  width:100%;
  max-width:420px;
}

.search input{
  width:100%;
  padding:13px 18px;
  border-radius:30px;
  border:1px solid #333640;
  background:#15171e;
  color:white;
  outline:none;
  font-size:15px;
}

.hero{
  max-width:1100px;
  min-height:350px;
  margin:25px auto;
  padding:40px;
  border-radius:25px;

  display:flex;
  align-items:center;

  background:
  linear-gradient(90deg,#08090d 5%,rgba(8,9,13,.7),rgba(8,9,13,.1)),
  url("https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=1400&q=80")
  center/cover;
}

.hero-content{
  max-width:560px;
}

.hero small{
  color:#ffcc00;
  font-weight:bold;
  letter-spacing:2px;
}

.hero h1{
  font-size:45px;
  margin:12px 0;
}

.hero p{
  color:#ccc;
  line-height:1.6;
  margin-bottom:20px;
}

.hero-btn{
  display:inline-block;
  background:#ffcc00;
  color:#111;
  padding:13px 22px;
  border-radius:10px;
  text-decoration:none;
  font-weight:bold;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:10px 20px 50px;
}

.main-tabs{
  display:flex;
  gap:12px;
  margin:25px 0;
}

.main-tab{
  padding:12px 25px;
  border-radius:30px;
  border:1px solid #333640;
  background:#15171e;
  color:#ddd;
  cursor:pointer;
  font-size:15px;
  font-weight:bold;
  transition:.3s;
}

.main-tab:hover,
.main-tab.active{
  background:#ffcc00;
  color:#111;
  border-color:#ffcc00;
}

.content-section{
  display:none;
}

.content-section.active{
  display:block;
}

.title{
  margin:25px 0 18px;
}

.title h2{
  font-size:26px;
}

.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding-bottom:15px;
}

.categories button{
  white-space:nowrap;
  padding:10px 17px;
  border-radius:25px;
  border:1px solid #333640;
  background:#15171e;
  color:#ddd;
  cursor:pointer;
}

.categories button.active,
.categories button:hover{
  background:#ffcc00;
  color:#111;
}

.movies{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:20px;
}

.movie{
  background:#12141a;
  border:1px solid #252731;
  border-radius:15px;
  overflow:hidden;
  transition:.3s;
}

.movie:hover{
  transform:translateY(-6px);
  border-color:#ffcc00;
  box-shadow:0 10px 30px rgba(255,204,0,.12);
}

.poster{
  height:270px;
  position:relative;
  overflow:hidden;
}

.poster img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:.3s;
}

.movie:hover img{
  transform:scale(1.05);
}

.rating{
  position:absolute;
  top:10px;
  right:10px;
  background:rgba(0,0,0,.85);
  color:#ffcc00;
  padding:6px 9px;
  border-radius:8px;
  font-weight:bold;
}

.episode{
  position:absolute;
  bottom:10px;
  left:10px;
  background:#ffcc00;
  color:#111;
  padding:6px 9px;
  border-radius:7px;
  font-size:12px;
  font-weight:bold;
}

.info{
  padding:14px;
}

.info h3{
  margin-bottom:8px;
  font-size:17px;
}

.meta{
  color:#888;
  font-size:13px;
  margin-bottom:13px;
}

.watch{
  display:block;
  text-align:center;
  padding:11px;
  border-radius:9px;
  background:#229ed9;
  color:white;
  text-decoration:none;
  font-weight:bold;
  font-size:14px;
  transition:.3s;
}

.watch:hover{
  background:#168bc0;
  transform:scale(1.02);
}

.serial-banner{
  margin:10px 0 25px;
  padding:22px;
  border-radius:18px;
  background:linear-gradient(135deg,#17130a,#111217);
